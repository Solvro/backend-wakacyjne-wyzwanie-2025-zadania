name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      # Testowa baza
      postgres_test:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: budzetownik_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      # Główna baza
      postgres_main:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: budzetownik
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@postgres_test:5432/budzetownik_test
      MAIN_DATABASE_URL: postgresql://postgres:postgres@postgres_main:5432/budzetownik
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Wait for Test DB
        run: |
          until pg_isready -h postgres_test -U postgres; do
            echo "Waiting for Test DB..."
            sleep 1
          done

      - name: Wait for Main DB
        run: |
          until pg_isready -h postgres_main -U postgres; do
            echo "Waiting for Main DB..."
            sleep 1
          done

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Migrate and seed Test DB
        run: |
          echo "Migrating Test DB..."
          npx prisma migrate deploy --schema=prisma/schema.test.prisma
          echo "Seeding Test DB..."
          npx ts-node prisma/seed.test.ts

      - name: Migrate and seed Main DB (opcjonalnie)
        run: |
          echo "Migrating Main DB..."
          npx prisma migrate deploy --schema=prisma/schema.prisma
          echo "Seeding Main DB..."
          npx ts-node prisma/seed.ts

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
