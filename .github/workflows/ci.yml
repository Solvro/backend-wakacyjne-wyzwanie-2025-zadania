name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres_test:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: budzetownik_test
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@postgres_test:5432/budzetownik_test
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Wait for Test DB
        run: |
          echo "Waiting for Test DB to be ready..."
          TIMEOUT=30
          until pg_isready -h postgres_test -U postgres -d budzetownik_test; do
            sleep 1
            TIMEOUT=$((TIMEOUT-1))
            if [ $TIMEOUT -le 0 ]; then
              echo "Postgres not ready after 30s"
              exit 1
            fi
          done

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Migrate and seed Test DB
        run: |
          echo "Migrating Test DB..."
          npx prisma migrate deploy
          echo "Seeding Test DB..."
          npx ts-node prisma/seed.test.ts

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
